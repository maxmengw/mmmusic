<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="600" height="400" fill="url(#bgGradient)"/>
  
  <!-- Musical notes decoration -->
  <g opacity="0.1">
    <path d="M 100 80 Q 110 70 120 80 Q 110 90 100 80" fill="#e94560" stroke="#e94560" stroke-width="2"/>
    <path d="M 480 120 Q 490 110 500 120 Q 490 130 480 120" fill="#e94560" stroke="#e94560" stroke-width="2"/>
    <path d="M 120 320 Q 130 310 140 320 Q 130 330 120 320" fill="#e94560" stroke="#e94560" stroke-width="2"/>
    <path d="M 500 280 Q 510 270 520 280 Q 510 290 500 280" fill="#e94560" stroke="#e94560" stroke-width="2"/>
  </g>
  
  <!-- Broken music player icon -->
  <g transform="translate(300, 100)">
    <!-- Large 404 text -->
    <text x="0" y="50" font-size="80" font-weight="bold" fill="#e94560" text-anchor="middle" font-family="Arial, sans-serif">
      404
    </text>
  </g>
  
  <!-- Speaker with X -->
  <g transform="translate(300, 180)">
    <!-- Speaker shape -->
    <rect x="-40" y="-30" width="80" height="60" rx="5" fill="none" stroke="#e94560" stroke-width="2"/>
    <circle cx="-25" cy="0" r="15" fill="none" stroke="#e94560" stroke-width="2"/>
    <circle cx="0" cy="0" r="10" fill="none" stroke="#e94560" stroke-width="2"/>
    <circle cx="25" cy="0" r="8" fill="none" stroke="#e94560" stroke-width="2"/>
    
    <!-- X mark over speaker -->
    <line x1="-50" y1="-35" x2="50" y2="35" stroke="#e94560" stroke-width="3" opacity="0.6"/>
    <line x1="50" y1="-35" x2="-50" y2="35" stroke="#e94560" stroke-width="3" opacity="0.6"/>
  </g>
  
  <!-- Text below -->
  <text x="300" y="320" font-size="24" fill="#ffffff" text-anchor="middle" font-family="Arial, sans-serif" font-weight="500">
    Page Not Found
  </text>
  <text x="300" y="355" font-size="14" fill="#888888" text-anchor="middle" font-family="Arial, sans-serif">
    The music stopped here. Let's go back.
  </text>
</svg>